<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAMVID</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f0f0f;
  color: #fff;
  font-family: 'Inter', sans-serif;
}

.header {
  display: flex;
  align-items: center;
  padding: 14px 20px;
  background: #111;
  border-bottom: 1px solid #292929;
}

.back-btn {
  color: white;
  text-decoration: none;
  font-size: 25px;
  margin-right: 16px;
}

.logo {
  font-size: 19px;
  font-weight: 800;
}

.logo span {
  color: orange;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

/* =========================
   MEDIA PLAYER
========================= */

.video-section {
  display: flex;
  justify-content: center;
  width: 100%;
  background: #000;
}

.player-container {
  width: 100%;
  max-width: 100%;
  background: #000;
}

.player-container.portrait {
  max-width: 400px;
}

.plyr {
  --plyr-color-main: #ff7900;
  --plyr-video-background: #000;
  --plyr-menu-background: #191919;
  --plyr-menu-color: #fff;
  font-family: 'Inter', sans-serif;
}

.plyr__control--overlaid {
  background: #ff7900;
  padding: 20px;
}

.plyr__control--overlaid:hover {
  background: #ff922e;
}

.plyr--video .plyr__controls {
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.92)
  );
}

.info-section {
  padding: 20px;
}

.video-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}

.video-id {
  color: #888;
  font-size: 12px;
}

/* =========================
   SLOT IKLAN AFILIASI
========================= */

.ad-section {
  width: 100%;
  padding: 12px 20px;
}

.ad-label {
  color: #777;
  font-size: 10px;
  text-align: center;
  margin-bottom: 7px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.affiliate-ad {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 90px;
  padding: 10px;
  background: #151515;
  border: 1px dashed #383838;
  border-radius: 8px;
  text-align: center;
  overflow: hidden;
}

.affiliate-ad img {
  display: block;
  max-width: 100%;
  height: auto;
}

.affiliate-ad a {
  color: #ff9a35;
  text-decoration: none;
}

.affiliate-ad a:hover {
  text-decoration: underline;
}

/* =========================
   REKOMENDASI VIDEO
========================= */

.recommend-section {
  padding: 20px;
  border-top: 1px solid #252525;
}

.recommend-title {
  color: orange;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
}

.recommend-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fill,
    minmax(150px, 1fr)
  );
  gap: 15px;
}

.rec-card {
  cursor: pointer;
  background: #191919;
  border-radius: 9px;
  overflow: hidden;
  transition: transform .2s;
}

.rec-card:hover {
  transform: translateY(-3px);
}

.rec-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}

.rec-thumb video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.rec-info {
  padding: 10px;
}

.rec-name {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

@media (min-width: 600px) {
  .recommend-grid {
    grid-template-columns: repeat(
      auto-fill,
      minmax(200px, 1fr)
    );
  }
}

@media (max-width: 500px) {
  .info-section,
  .recommend-section {
    padding: 15px;
  }

  .video-title {
    font-size: 17px;
  }

  .recommend-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .ad-section {
    padding: 10px 15px;
  }
}
</style>
</head>

<body>

<header class="header">
  <a class="back-btn" href="index.html" aria-label="Kembali">←</a>
  <div class="logo">STREAM<span>VID</span></div>
</header>

<main class="container">

  <!-- PLAYER VIDEO -->
  <section class="video-section">
    <div class="player-container" id="playerWrapper">
      <video id="player" playsinline controls preload="metadata"></video>
    </div>
  </section>

  <!-- IKLAN AFILIASI 1: TEPAT DI BAWAH PLAYER -->
  <section class="ad-section">
    <div class="ad-label">Advertisement</div>
    <div class="affiliate-ad" id="affiliateAd1">

      <!-- GANTI BAGIAN INI DENGAN KODE IKLAN AFILIASI KAMU -->
      <a href="https://example.com/affiliate-link"
         target="_blank"
         rel="sponsored nofollow noopener">
        Tempat Iklan Afiliasi 1
      </a>

    </div>
  </section>

  <!-- INFORMASI VIDEO -->
  <section class="info-section">
    <div class="video-title" id="mainTitle">Memuat judul...</div>
    <div class="video-id" id="mainId">ID: --</div>
  </section>

  <!-- IKLAN AFILIASI 2: DI BAWAH INFORMASI VIDEO -->
  <section class="ad-section">
    <div class="ad-label">Advertisement</div>
    <div class="affiliate-ad" id="affiliateAd2">

      <!-- GANTI DENGAN KODE IKLAN AFILIASI KEDUA -->
      <a href="https://example.com/affiliate-link"
         target="_blank"
         rel="sponsored nofollow noopener">
        Tempat Iklan Afiliasi 2
      </a>

    </div>
  </section>

  <!-- REKOMENDASI VIDEO -->
  <section class="recommend-section">
    <div class="recommend-title">Video Lainnya</div>
    <div class="recommend-grid" id="recommendGrid"></div>
  </section>

  <!-- IKLAN AFILIASI 3: SETELAH REKOMENDASI -->
  <section class="ad-section">
    <div class="ad-label">Advertisement</div>
    <div class="affiliate-ad" id="affiliateAd3">

      <!-- GANTI DENGAN KODE IKLAN AFILIASI KETIGA -->
      <a href="https://example.com/affiliate-link"
         target="_blank"
         rel="sponsored nofollow noopener">
        Tempat Iklan Afiliasi 3
      </a>

    </div>
  </section>

</main>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
const params = new URLSearchParams(location.search);
const videoId = params.get("id");

const player = new Plyr("#player", {
  controls: [
    "play-large",
    "play",
    "progress",
    "current-time",
    "duration",
    "mute",
    "volume",
    "settings",
    "fullscreen"
  ],
  settings: ["speed"],
  speed: {
    selected: 1,
    options: [0.5, 0.75, 1, 1.25, 1.5, 2]
  },
  tooltips: {
    controls: true,
    seek: true
  },
  clickToPlay: true,
  hideControls: true
});

fetch("videos.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Gagal memuat videos.json");
    }
    return response.json();
  })
  .then(data => {
    const currentVideo = data.find(
      video => String(video.id) === String(videoId)
    );

    if (!currentVideo) {
      document.getElementById("mainTitle").textContent =
        "Video tidak ditemukan.";
      return;
    }

    setupPlayer(currentVideo);
    loadRecommendations(data, currentVideo.id);
  })
  .catch(error => {
    console.error(error);
    document.getElementById("mainTitle").textContent =
      "Gagal memuat video.";
  });

function setupPlayer(video) {
  document.getElementById("mainTitle").textContent =
    video.Judul;

  document.getElementById("mainId").textContent =
    "ID: " + video.id;

  const element = document.getElementById("player");
  const wrapper = document.getElementById("playerWrapper");

  element.src = video.Url;
  element.load();

  element.addEventListener("loadedmetadata", function () {
    wrapper.classList.toggle(
      "portrait",
      this.videoWidth / this.videoHeight < 1
    );
  }, { once: true });

  // Browser mungkin memblokir autoplay.
  player.play().catch(() => {});
}

function loadRecommendations(data, currentId) {
  const grid = document.getElementById("recommendGrid");
  grid.replaceChildren();

  const filtered = data.filter(
    video => String(video.id) !== String(currentId)
  );

  const shuffled = [...filtered].sort(
    () => Math.random() - 0.5
  );

  shuffled.slice(0, 6).forEach(video => {
    const card = document.createElement("div");
    card.className = "rec-card";

    const thumb = document.createElement("div");
    thumb.className = "rec-thumb";

    const preview = document.createElement("video");
    preview.src = video.Url;
    preview.preload = "metadata";
    preview.muted = true;
    preview.playsInline = true;

    preview.addEventListener("loadedmetadata", function () {
      thumb.style.aspectRatio =
        this.videoWidth / this.videoHeight < 1
          ? "9 / 16"
          : "16 / 9";
    }, { once: true });

    const info = document.createElement("div");
    info.className = "rec-info";

    const name = document.createElement("div");
    name.className = "rec-name";
    name.textContent = video.Judul;

    info.appendChild(name);
    thumb.appendChild(preview);
    card.append(thumb, info);

    card.addEventListener("click", () => {
      location.href =
        "detail.html?id=" + encodeURIComponent(video.id);
    });

    grid.appendChild(card);
  });
}
</script>

</body>
</html>
