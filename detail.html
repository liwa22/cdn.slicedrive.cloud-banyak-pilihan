
<script>
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get("id");

  const AD_URL = "https://auctionr.org/4/e6b089d52bd22828a8f8a1c9cb7a1bd5";

  let allVideos = [];
  let adTimer = null;
  let firstPlayAdTriggered = false;

  const player = new Plyr('#player', {
    controls: [
      'play-large',
      'play',
      'progress',
      'current-time',
      'mute',
      'volume',
      'fullscreen'
    ],
    tooltips: {
      controls: true,
      seek: true
    }
  });

  // Buka iklan. Pemanggilan langsung dari klik pengguna
  // lebih berpeluang diizinkan oleh browser.
  function triggerAd() {
    if (!AD_URL) return;

    const adWindow = window.open(AD_URL, '_blank');

    if (adWindow) {
      adWindow.opener = null;
    } else {
      console.warn(
        "Iklan diblokir browser. Izinkan pop-up untuk situs ini."
      );
    }
  }

  // Tangkap klik tombol Play secara langsung.
  // Ini membantu agar iklan pertama tidak dianggap pop-up otomatis.
  document.getElementById('playerWrapper').addEventListener(
    'click',
    function (event) {
      const playButton = event.target.closest(
        '.plyr__control[data-plyr="play"], .plyr__control--overlaid'
      );

      if (playButton && !firstPlayAdTriggered) {
        firstPlayAdTriggered = true;
        triggerAd();
      }
    },
    true
  );

  function startAdTimer() {
    if (adTimer !== null) {
      clearInterval(adTimer);
    }

    adTimer = setInterval(function () {
      if (!player.paused && !player.ended) {
        triggerAd();
      }
    }, 30000);
  }

  function stopAdTimer() {
    if (adTimer !== null) {
      clearInterval(adTimer);
      adTimer = null;
    }
  }

  // Saat video mulai diputar
  player.on('play', function () {
    if (!firstPlayAdTriggered) {
      firstPlayAdTriggered = true;
      triggerAd();
    }

    startAdTimer();
  });

  // Hentikan timer ketika video dijeda atau selesai
  player.on('pause', stopAdTimer);
  player.on('ended', stopAdTimer);

  // Ambil data video
  fetch('videos.json')
    .then(function (res) {
      if (!res.ok) {
        throw new Error('Gagal memuat videos.json');
      }

      return res.json();
    })
    .then(function (data) {
      allVideos = data;

      const currentVideo = data.find(function (v) {
        return String(v.id) === String(videoId);
      });

      if (currentVideo) {
        setupPlayer(currentVideo);
        loadRecommendations(data, videoId);
      } else {
        document.getElementById('mainTitle').innerText =
          'Video tidak ditemukan.';
      }
    })
    .catch(function (error) {
      console.error(error);

      document.getElementById('mainTitle').innerText =
        'Gagal memuat data video.';
    });

  // Setup video player dan deteksi orientasi
  function setupPlayer(video) {
    document.getElementById('mainTitle').innerText = video.Judul;
    document.getElementById('mainId').innerText = 'ID: ' + video.id;

    const videoElement = document.getElementById('player');
    const wrapper = document.getElementById('playerWrapper');

    videoElement.src = video.Url;

    videoElement.onloadedmetadata = function () {
      const ratio = this.videoWidth / this.videoHeight;

      if (ratio < 1) {
        wrapper.classList.add('portrait');
      } else {
        wrapper.classList.remove('portrait');
      }
    };

    // Video menunggu pengguna menekan Play.
  }

  // Muat rekomendasi video secara acak
  function loadRecommendations(data, currentId) {
    const grid = document.getElementById('recommendGrid');
    grid.innerHTML = '';

    const filtered = data.filter(function (v) {
      return String(v.id) !== String(currentId);
    });

    const shuffled = filtered.sort(function () {
      return 0.5 - Math.random();
    });

    const selection = shuffled.slice(0, 6);

    selection.forEach(function (v) {
      const card = document.createElement('div');
      card.className = 'rec-card';

      const thumb = document.createElement('div');
      thumb.className = 'rec-thumb';

      const thumbVid = document.createElement('video');
      thumbVid.preload = 'metadata';
      thumbVid.muted = true;
      thumbVid.playsInline = true;

      const source = document.createElement('source');
      source.src = v.Url + '#t=0.5';
      source.type = 'video/mp4';

      thumbVid.appendChild(source);

      const info = document.createElement('div');
      info.className = 'rec-info';

      const name = document.createElement('div');
      name.className = 'rec-name';
      name.textContent = v.Judul;

      thumb.appendChild(thumbVid);
      info.appendChild(name);
      card.appendChild(thumb);
      card.appendChild(info);

      thumbVid.onloadedmetadata = function () {
        thumb.style.aspectRatio =
          this.videoWidth / this.videoHeight < 1
            ? '9 / 16'
            : '16 / 9';
      };

      card.onclick = function () {
        window.location.href =
          'detail.html?id=' + encodeURIComponent(v.id);
      };

      grid.appendChild(card);
    });
  }
</script>
