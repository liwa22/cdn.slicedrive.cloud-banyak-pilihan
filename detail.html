 <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAMVID</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f0f0f;
  font-family: 'Inter', sans-serif;
  color: white;
}

.header {
  display: flex;
  align-items: center;
  padding: 15px 20px;
  background: #111;
  border-bottom: 1px solid #292929;
}

.back-btn {
  color: white;
  text-decoration: none;
  margin-right: 16px;
  font-size: 24px;
}

.logo {
  font-size: 19px;
  font-weight: 800;
}

.logo span {
  color: #ff7900;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* PLAYER */
.video-section {
  width: 100%;
  background: #000;
  display: flex;
  justify-content: center;
}

.player-container {
  width: 100%;
  max-width: 100%;
  background: #000;
}

.player-container.portrait {
  max-width: 400px;
}

.player-container video {
  display: block;
  width: 100%;
}

/* Plyr theme */
.plyr {
  --plyr-color-main: #ff7900;
  --plyr-video-background: #000;
  --plyr-menu-background: #171717;
  --plyr-menu-color: #fff;
  --plyr-tooltip-background: #ff7900;
  --plyr-tooltip-color: #fff;
  font-family: 'Inter', sans-serif;
}

.plyr--video {
  border-radius: 0;
}

.plyr__control--overlaid {
  background: rgba(255, 121, 0, .95);
  border: 0;
  padding: 20px;
  box-shadow: 0 0 35px rgba(255, 121, 0, .25);
}

.plyr__control--overlaid:hover {
  background: #ff922e;
}

.plyr--full-ui input[type=range] {
  color: #ff7900;
}

.plyr__controls {
  padding: 12px !important;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.9)
  ) !important;
}

.plyr__controls .plyr__control {
  border-radius: 6px;
}

.info-section {
  padding: 20px;
}

.video-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}

.video-id {
  color: #888;
  font-size: 12px;
}

/* REKOMENDASI */
.recommend-section {
  padding: 20px;
  border-top: 1px solid #252525;
}

.recommend-title {
  font-size: 16px;
  font-weight: 700;
  color: #ff7900;
  margin-bottom: 16px;
}

.recommend-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
}

.rec-card {
  cursor: pointer;
  background: #191919;
  border-radius: 9px;
  overflow: hidden;
  transition: transform .2s, background .2s;
}

.rec-card:hover {
  transform: translateY(-3px);
  background: #252525;
}

.rec-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  position: relative;
  overflow: hidden;
}

.rec-thumb video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.rec-info {
  padding: 10px;
}

.rec-name {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

@media (min-width: 600px) {
  .recommend-grid {
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
}

@media (max-width: 500px) {
  .video-title {
    font-size: 17px;
  }

  .info-section,
  .recommend-section {
    padding: 15px;
  }

  .recommend-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .plyr__controls {
    padding: 8px !important;
  }
}
</style>
</head>

<body>

<header class="header">
  <a class="back-btn" href="index.html" aria-label="Kembali">←</a>
  <div class="logo">STREAM<span>VID</span></div>
</header>

<div class="container">

  <section class="video-section">
    <div class="player-container" id="playerWrapper">
      <video id="player" playsinline controls preload="metadata"></video>
    </div>
  </section>

  <section class="info-section">
    <div class="video-title" id="mainTitle">Memuat judul...</div>
    <div class="video-id" id="mainId">ID: --</div>
  </section>

  <section class="recommend-section">
    <div class="recommend-title">Video Lainnya</div>
    <div class="recommend-grid" id="recommendGrid"></div>
  </section>

</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const videoId = params.get("id");

const player = new Plyr("#player", {
  controls: [
    "play-large",
    "play",
    "progress",
    "current-time",
    "duration",
    "mute",
    "volume",
    "settings",
    "fullscreen"
  ],
  settings: ["speed"],
  speed: {
    selected: 1,
    options: [0.5, 0.75, 1, 1.25, 1.5, 2]
  },
  tooltips: {
    controls: true,
    seek: true
  },
  keyboard: {
    focused: true,
    global: true
  },
  clickToPlay: true,
  hideControls: true,
  resetOnEnd: false
});

fetch("videos.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Gagal mengambil videos.json");
    }
    return response.json();
  })
  .then(data => {
    const currentVideo = data.find(
      video => String(video.id) === String(videoId)
    );

    if (!currentVideo) {
      document.getElementById("mainTitle").textContent =
        "Video tidak ditemukan.";
      return;
    }

    setupPlayer(currentVideo);
    loadRecommendations(data, currentVideo.id);
  })
  .catch(error => {
    console.error(error);
    document.getElementById("mainTitle").textContent =
      "Gagal memuat video. Periksa file videos.json.";
  });

function setupPlayer(video) {
  document.getElementById("mainTitle").textContent = video.Judul;
  document.getElementById("mainId").textContent = "ID: " + video.id;

  const videoElement = document.getElementById("player");
  const wrapper = document.getElementById("playerWrapper");

  videoElement.src = video.Url;
  videoElement.load();

  videoElement.addEventListener("loadedmetadata", function () {
    const ratio = this.videoWidth / this.videoHeight;
    wrapper.classList.toggle("portrait", ratio < 1);
  }, { once: true });

  // Autoplay dicoba; browser bisa menolaknya.
  player.play().catch(() => {});
}

function loadRecommendations(data, currentId) {
  const grid = document.getElementById("recommendGrid");
  grid.replaceChildren();

  const filtered = data.filter(
    video => String(video.id) !== String(currentId)
  );

  const shuffled = [...filtered].sort(() => Math.random() - 0.5);
  const selection = shuffled.slice(0, 6);

  selection.forEach(video => {
    const card = document.createElement("div");
    card.className = "rec-card";

    const thumb = document.createElement("div");
    thumb.className = "rec-thumb";

    const preview = document.createElement("video");
    preview.preload = "metadata";
    preview.muted = true;
    preview.playsInline = true;
    preview.setAttribute("aria-label", video.Judul);

    // URL berasal dari videos.json, bukan dari input pengguna.
    preview.src = video.Url;

    preview.addEventListener("loadedmetadata", function () {
      thumb.style.aspectRatio =
        this.videoWidth / this.videoHeight < 1 ? "9 / 16" : "16 / 9";
    }, { once: true });

    const info = document.createElement("div");
    info.className = "rec-info";

    const name = document.createElement("div");
    name.className = "rec-name";
    name.textContent = video.Judul;

    info.appendChild(name);
    thumb.appendChild(preview);
    card.append(thumb, info);

    card.addEventListener("click", () => {
      window.location.href =
        "detail.html?id=" + encodeURIComponent(video.id);
    });

    grid.appendChild(card);
  });
}
</script>

</body>
</html>
