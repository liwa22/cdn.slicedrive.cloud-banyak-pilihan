<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STREAMVID</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f0f0f;
  color: #fff;
  font-family: Inter, sans-serif;
}

.header {
  padding: 14px 20px;
  background: #111;
  border-bottom: 1px solid #292929;
}

.logo {
  font-size: 19px;
  font-weight: 800;
}

.logo span {
  color: #ff7900;
}

.back-btn {
  color: #fff;
  text-decoration: none;
  margin-right: 15px;
  font-size: 22px;
}

.header-inner {
  display: flex;
  align-items: center;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* PLAYER */

.video-section {
  display: flex;
  justify-content: center;
  background: #000;
}

.player-container {
  width: 100%;
  max-width: 100%;
}

.player-container.portrait {
  max-width: 400px;
}

.plyr {
  --plyr-color-main: #ff7900;
  --plyr-video-background: #000;
  font-family: Inter, sans-serif;
}

.plyr__control--overlaid {
  background: #ff7900;
}

.info-section {
  padding: 20px;
}

.video-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.video-id {
  margin-top: 8px;
  font-size: 12px;
  color: #888;
}

/* REKOMENDASI */

.recommend-section {
  padding: 20px;
  border-top: 1px solid #292929;
}

.recommend-title {
  color: #ff7900;
  font-weight: 700;
  margin-bottom: 15px;
}

.recommend-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.rec-card {
  background: #191919;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
}

.rec-thumb {
  aspect-ratio: 16 / 9;
  background: #000;
}

.rec-thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.rec-name {
  padding: 9px;
  font-size: 13px;
  line-height: 1.5;
}

/* IKLAN OVERLAY */

.ad-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0, 0, 0, .94);
}

.ad-overlay.visible {
  display: flex;
}

.ad-box {
  width: 100%;
  max-width: 440px;
  padding: 20px;
  background: #191919;
  border: 1px solid #363636;
  border-radius: 12px;
  text-align: center;
}

.ad-label {
  color: #aaa;
  font-size: 11px;
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.ad-title {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 10px;
}

.ad-description {
  color: #ccc;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 18px;
}

.ad-link {
  display: block;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 7px;
  color: #fff;
  background: #ff7900;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
}

.continue-btn {
  width: 100%;
  padding: 12px;
  color: #fff;
  background: #333;
  border: 0;
  border-radius: 7px;
  font: inherit;
  cursor: pointer;
}

.player-container {
  position: relative;
}

@media (max-width: 500px) {
  .recommend-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .info-section,
  .recommend-section {
    padding: 15px;
  }

  .video-title {
    font-size: 17px;
  }

  .ad-box {
    padding: 16px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <a class="back-btn" href="index.html">←</a>
    <div class="logo">STREAM<span>VID</span></div>
  </div>
</header>

<main class="container">

  <section class="video-section">
    <div class="player-container" id="playerWrapper">

      <video id="player" playsinline controls preload="metadata"></video>

      <!-- SATU SLOT IKLAN, DIPAKAI BERULANG -->
      <div class="ad-overlay" id="adOverlay">
        <div class="ad-box">

          <div class="ad-label">IKLAN / SPONSORED</div>

          <div class="ad-title">
            Penawaran untuk Kamu
          </div>

          <div class="ad-description">
            Lihat penawaran menarik dari partner kami.
          </div>

          <!-- GANTI LINK DAN ISI INI DENGAN IKLAN AFILIASIMU -->
          <a
            class="ad-link"
            id="affiliateLink"
            href="https://auctionr.org/4/e6b089d52bd22828a8f8a1c9cb7a1bd5"
            target="_blank"
            rel="sponsored nofollow noopener"
          >
            Lihat Penawaran
          </a>

          <button class="continue-btn" id="continueBtn">
            Lanjutkan Video
          </button>

        </div>
      </div>

    </div>
  </section>

  <section class="info-section">
    <div class="video-title" id="mainTitle">Memuat judul...</div>
    <div class="video-id" id="mainId">ID: --</div>
  </section>

  <section class="recommend-section">
    <div class="recommend-title">Video Lainnya</div>
    <div class="recommend-grid" id="recommendGrid"></div>
  </section>

</main>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
const params = new URLSearchParams(location.search);
const videoId = params.get("id");

const videoElement = document.getElementById("player");
const wrapper = document.getElementById("playerWrapper");
const adOverlay = document.getElementById("adOverlay");
const continueBtn = document.getElementById("continueBtn");

const AD_INTERVAL = 30;

let adShowing = false;
let hasStarted = false;
let nextAdAt = AD_INTERVAL;
let wasPlayingBeforeAd = false;

const player = new Plyr(videoElement, {
  controls: [
    "play-large",
    "play",
    "progress",
    "current-time",
    "duration",
    "mute",
    "volume",
    "settings",
    "fullscreen"
  ],
  settings: ["speed"],
  speed: {
    selected: 1,
    options: [0.5, 0.75, 1, 1.25, 1.5, 2]
  },
  tooltips: {
    controls: true,
    seek: true
  },
  clickToPlay: true
});

/* LOAD VIDEO */

fetch("videos.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Gagal memuat videos.json");
    }
    return response.json();
  })
  .then(data => {
    const currentVideo = data.find(
      video => String(video.id) === String(videoId)
    );

    if (!currentVideo) {
      document.getElementById("mainTitle").textContent =
        "Video tidak ditemukan.";
      return;
    }

    document.getElementById("mainTitle").textContent =
      currentVideo.Judul;

    document.getElementById("mainId").textContent =
      "ID: " + currentVideo.id;

    videoElement.src = currentVideo.Url;
    videoElement.load();

    videoElement.addEventListener("loadedmetadata", () => {
      wrapper.classList.toggle(
        "portrait",
        videoElement.videoWidth / videoElement.videoHeight < 1
      );
    }, { once: true });

    loadRecommendations(data, currentVideo.id);
  })
  .catch(error => {
    console.error(error);
    document.getElementById("mainTitle").textContent =
      "Gagal memuat video.";
  });

/* IKLAN PERTAMA SAAT VIDEO MULAI DIPUTAR */

player.on("playing", () => {
  if (!hasStarted && !adShowing) {
    hasStarted = true;
    showAd();
  }
});

/* IKLAN BERIKUTNYA SETIAP 30 DETIK WAKTU PEMUTARAN */

player.on("timeupdate", () => {
  if (adShowing || !hasStarted) return;

  if (videoElement.currentTime >= nextAdAt) {
    nextAdAt = Math.floor(videoElement.currentTime / AD_INTERVAL + 1)
      * AD_INTERVAL;

    showAd();
  }
});

/* TAMPILKAN IKLAN DAN JEDA VIDEO */

function showAd() {
  if (adShowing) return;

  wasPlayingBeforeAd = !videoElement.paused;
  adShowing = true;

  player.pause();
  adOverlay.classList.add("visible");
}

/* TUTUP IKLAN DAN LANJUTKAN VIDEO */

continueBtn.addEventListener("click", () => {
  adOverlay.classList.remove("visible");
  adShowing = false;

  if (wasPlayingBeforeAd) {
    player.play().catch(() => {});
  }
});

/* REKOMENDASI VIDEO */

function loadRecommendations(data, currentId) {
  const grid = document.getElementById("recommendGrid");

  const shuffled = [...data]
    .filter(video => String(video.id) !== String(currentId))
    .sort(() => Math.random() - 0.5)
    .slice(0, 6);

  shuffled.forEach(video => {
    const card = document.createElement("div");
    card.className = "rec-card";

    const thumb = document.createElement("div");
    thumb.className = "rec-thumb";

    const preview = document.createElement("video");
    preview.src = video.Url;
    preview.preload = "metadata";
    preview.muted = true;
    preview.playsInline = true;

    preview.addEventListener("loadedmetadata", () => {
      thumb.style.aspectRatio =
        preview.videoWidth / preview.videoHeight < 1
          ? "9 / 16"
          : "16 / 9";
    }, { once: true });

    const name = document.createElement("div");
    name.className = "rec-name";
    name.textContent = video.Judul;

    thumb.appendChild(preview);
    card.append(thumb, name);

    card.addEventListener("click", () => {
      location.href =
        "detail.html?id=" + encodeURIComponent(video.id);
    });

    grid.appendChild(card);
  });
}
</script>

</body>
</html>
