
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get("id");

  // GANTI dengan URL iklan affiliate kamu
  const AD_URL = "https://auctionr.org/4/e6b089d52bd22828a8f8a1c9cb7a1bd5";

  let allVideos = [];
  let adTimer = null;
  let firstPlayAdTriggered = false;

  const player = new Plyr('#player', {
    controls: [
      'play-large',
      'play',
      'progress',
      'current-time',
      'mute',
      'volume',
      'fullscreen'
    ],
    tooltips: {
      controls: true,
      seek: true
    }
  });

  // Menjalankan iklan
  function triggerAd() {
    if (!AD_URL || AD_URL === "https://auctionr.org/4/e6b089d52bd22828a8f8a1c9cb7a1bd5") {
      console.warn("Silakan isi URL iklan pada variabel AD_URL.");
      return;
    }

    window.open(AD_URL, '_blank', 'noopener,noreferrer');
  }

  // Saat video mulai diputar
  player.on('play', function () {
    // Iklan pertama kali saat Play
    if (!firstPlayAdTriggered) {
      firstPlayAdTriggered = true;
      triggerAd();
    }

    // Hindari membuat timer ganda
    if (adTimer !== null) {
      clearInterval(adTimer);
    }

    // Iklan berikutnya setiap 30 detik selama video diputar
    adTimer = setInterval(function () {
      if (!player.paused && !player.ended) {
        triggerAd();
      }
    }, 30000);
  });

  // Hentikan penghitung ketika video dijeda
  player.on('pause', function () {
    if (adTimer !== null) {
      clearInterval(adTimer);
      adTimer = null;
    }
  });

  // Hentikan penghitung ketika video selesai
  player.on('ended', function () {
    if (adTimer !== null) {
      clearInterval(adTimer);
      adTimer = null;
    }
  });

  // Ambil data video
  fetch('videos.json')
    .then(res => {
      if (!res.ok) {
        throw new Error("Gagal memuat videos.json");
      }
      return res.json();
    })
    .then(data => {
      allVideos = data;

      const currentVideo = data.find(v => v.id === videoId);

      if (currentVideo) {
        setupPlayer(currentVideo);
        loadRecommendations(data, videoId);
      } else {
        document.getElementById('mainTitle').innerText =
          "Video tidak ditemukan.";
      }
    })
    .catch(error => {
      console.error(error);
      document.getElementById('mainTitle').innerText =
        "Gagal memuat data video.";
    });

  // Setup video player dan deteksi orientasi
  function setupPlayer(video) {
    document.getElementById('mainTitle').innerText = video.Judul;
    document.getElementById('mainId').innerText = "ID: " + video.id;

    const videoElement = document.getElementById('player');
    videoElement.src = video.Url;

    videoElement.onloadedmetadata = function () {
      const ratio = this.videoWidth / this.videoHeight;
      const wrapper = document.getElementById('playerWrapper');

      if (ratio < 1) {
        wrapper.classList.add('portrait');
      } else {
        wrapper.classList.remove('portrait');
      }
    };

    // Tidak memaksa autoplay agar klik Play pertama
    // dapat menjadi pemicu iklan pertama.
  }

  // Muat rekomendasi video secara acak
  function loadRecommendations(data, currentId) {
    const grid = document.getElementById('recommendGrid');
    grid.innerHTML = "";

    const filtered = data.filter(v => v.id !== currentId);
    const shuffled = filtered.sort(() => 0.5 - Math.random());
    const selection = shuffled.slice(0, 6);

    selection.forEach(v => {
      const card = document.createElement('div');
      card.className = "rec-card";

      const thumb = document.createElement('div');
      thumb.className = "rec-thumb";

      const thumbVid = document.createElement('video');
      thumbVid.preload = "metadata";
      thumbVid.muted = true;
      thumbVid.playsInline = true;

      const source = document.createElement('source');
      source.src = v.Url + "#t=0.5";
      source.type = "video/mp4";
      thumbVid.appendChild(source);

      const info = document.createElement('div');
      info.className = "rec-info";

      const name = document.createElement('div');
      name.className = "rec-name";
      name.textContent = v.Judul;

      thumb.appendChild(thumbVid);
      info.appendChild(name);
      card.appendChild(thumb);
      card.appendChild(info);

      thumbVid.onloadedmetadata = function () {
        thumb.style.aspectRatio =
          this.videoWidth / this.videoHeight < 1 ? "9/16" : "16/9";
      };

      card.onclick = () => {
        window.location.href =
          `detail.html?id=${encodeURIComponent(v.id)}`;
      };

      grid.appendChild(card);
    });
  }
</script>
